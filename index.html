<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lucca</title>
        <!-- 🌟【修正】リンク切れしていたアドレスを、Google公式の正しいフォントサーバーURLへ上書きしました -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="lucca">
    <link rel="apple-touch-icon" href="https://flaticon.com">
    <style>
    
    body {
    background-color: #ffffff;
    /* 🌟【調整】お花の光の輪がはっきり見えるように濃度（透明度）を引き上げました */
    background-image: 
        radial-gradient(circle at 85% 15%, rgba(92, 84, 70, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 15% 55%, rgba(140, 126, 116, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 85%, rgba(191, 174, 158, 0.18) 0%, transparent 45%);
    background-attachment: fixed;
            
    color: #5c4e46; /* 柔らかく洗練されたセピアグレー */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            padding: 60px 20px;
            text-align: center;
            overflow-x: hidden; 
            letter-spacing: 0.08em;

                        /* 🌟【追加】画面内のすべての色・背景の変化を0.5秒かけて滑らかに引き算する */
            transition: background-color 0.5s cubic-bezier(0.25, 1, 0.5, 1), color 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
            /* 仲間外れを防ぐため、頭に「.left-column」を添えてフォーム専用の設定に限定します */
    .left-column input, .left-column button, .left-column select, .left-column textarea {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-weight: 200 !important;
        }




     .wrapper {
    /* 🌟【変更】横幅をスマホサイズ（400px）に制限し、大胆な余白を作って中央に佇ませる */
    max-width: 400px; 
    margin: 0 auto;
    position: relative;
    padding: 20px 10px; /* 窮屈にならない程度の内側の余白 */
    }

    /* 🌟【追加】横並びになっていたメインコンテナを縦一列（中央寄せ）に強制調律します */
    .main-container {
    flex-direction: column !important;
    align-items: center !important;
    gap: 40px !important; /* 計算エリアとカレンダーの間の美しい縦余白 */
    }

    /* 🌟【追加】左右のカラムの幅を100%に広げて、中央寄せの軸を完璧に揃えます */
    .left-column, .right-column {
    max-width: 100% !important;
    width: 100% !important;
    }

        /* カレンダーの月の数字専用スタイル */
        .calendar-month-text {
            font-size: 24px;       /* 数字を心地よい大きさに拡張 */
            font-weight: 300;      /* 太さを細くしてノイズ感を抑える */
            color: #5c4e46;        /* 落ち着いたセピアグレー */
            letter-spacing: 0.02em;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px 8px;
            margin-top: 15px;
        }
        .weekday-label {
            font-size: 11px;
            color: #d1c7bd; /* 柔らかく主張しない色 */
            font-weight: 300;
            text-transform: uppercase;
        }
                .calendar-day {
            font-size: 12px;
            color: #bfae9e; /* 通常の数字を少し淡くしてノイズを減らす */
            font-weight: 300;
            width: 28px;
            height: 28px; /* ドットが入るスペースを確保するために少し高さを広げる */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-sizing: border-box; /* 🌟サイズ計算を均一に固定する */
            margin: 0 auto;         /* 🌟グリッドのマス目の中で綺麗に中央に佇ませる */
            
            /* 🌟 overflow: hidden; は絶対に入れない（お花が消える原因になります） */
        }
        /* 支出がある日にひっそり灯るドット */
        .calendar-day.has-dot::after {
            content: '•';
            font-size: 10px;
            color: #8c7e74;
            position: absolute;
            bottom: -4px;
            left: calc(50% - 4px); /* 中央から4pxだけ左にずらす */
            transform: translateX(-50%);
            line-height: 1;
        }
        /* 名前の衝突を防ぐため、クラスを重ねて after の右側にピンクを灯す */
        .calendar-day.has-memo-dot:not(.has-dot)::after {
            content: '•';
            font-size: 10px;
            color: #eacccc;
            position: absolute;
            bottom: -4px;
            left: calc(50% + 4px); /* 中央から4pxだけ右にずらす */
            transform: translateX(-50%);
            line-height: 1;
        }
        /* グレーとピンクが「両方ある日」は、美しく横並びする2つのドット */
        .calendar-day.has-dot.has-memo-dot::after {
            content: '••';
            font-size: 10px;
            letter-spacing: 4px;
            position: absolute;
            bottom: -4px;
            left: calc(50% + 2px);
            transform: translateX(-50%);
            background: linear-gradient(to right, #8c7e74 50%, #eacccc 50%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }  

                /* 🌟 お花を before から after に変更し、スタッキングコンテキストの影響を受けない特等席へ */
        .calendar-day.is-period-start::after {
            content: '✿'; /* 🌟 月の涙をイメージした花のシルエット */
            font-size: 10px;
            color: #EBE1A9; /* 🌟 仄かに青白く光る、月の涙のティアーズカラー */
            position: absolute;
            top: -2px; 
            right: -3px;
            line-height: 1;
            z-index: 5; /* 🌟 グレーの座布団より確実に前に出す */
            font-weight: normal;
        }

        /* 👑 10月7日の特別な日だけに左上に灯る王冠 */
        .calendar-day.is-special-crown::after {
            content: '👑' !important; /* 既存のドットを上書きして王冠を優先 */
            font-size: 8px;           /* 📍よりほんの少し小さく上品に */
            position: absolute;
            top: -1px;                /* 📍と同じ高さに揃える */
            left: -1px;               /* 👈 左上の美しい位置に配置 */
            right: auto !important;   /* 右側を解除 */
            line-height: 1;
            z-index: 2;
            color: initial;
            background: none !important;
            -webkit-text-fill-color: initial !important;
        }

                /* カレンダーの日付が選択されたとき（文字色と太さだけを変える） */
        .calendar-day.is-selected {
            color: #5c4e46;
            font-weight: 500;
            position: relative;
        }
        /* 選択されたとき、中の数字やお花を動かさずに「背景の座布団」だけを敷く */
        .calendar-day.is-selected::before {
            content: '';
            position: absolute;
            top: 3px;             
            left: 0;
            width: 28px;          
            height: 30px;         
            background-color: #e8e7e8; 
            border-radius: 4px;   /* ほんのり丸い四角 */
            z-index: -1;          /* 🌟 数字の後ろ、マスの白背景の前に敷く */
        }


        
        /* 🌟 日記エリアを「画面中央に佇む美しいシステムウィンドウ」へと強制調律 */
        .daily-memo-section {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -45%) !important;
            width: 320px !important;
            max-width: 85% !important;
            background: rgba(16, 25, 48, 0.85) !important; /* 👈 ゲーム画面のような美しい半透明の闇 */
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(210, 215, 223, 0.08) !important;
            border-radius: 16px !important;
            padding: 24px 24px 140px 24px !important; /* 🌟 下側の内余白を140pxに広げて、履歴がすっぽり収まる秘密の部屋を作ります */
            box-sizing: border-box !important;
            z-index: 3000 !important;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3) !important;
            animation: fadeInMemoModal 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes fadeInMemoModal {
            from { opacity: 0; transform: translate(-50%, -40%) scale(0.96); filter: blur(4px); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); }
        }



        .memo-date-left {
    font-family: 'Inter', sans-serif;
    font-weight: 100;
    font-size: 34px;
    color: #5c4e46;
    line-height: 0.9;
    min-width: 40px;
    text-align: right;
    margin-top: 1px;
    letter-spacing: -0.05em; /* 数字同士はシュッと引き締める */
}

    /* 中央：美しい境界線（縦線） */
    .memo-center-line {
    width: 1px;
    background-color: #f2ede9; /* 🌟 より淡く、肌馴染みの良い極薄セピアへ */
    align-self: stretch; /* エリアの高さに合わせて縦に伸びる */
    opacity: 0.7;        /* 🌟 透過させてさらに儚く */
}


/* 右側：コンテンツをまとめる部屋 */
.memo-content-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px; /* 各要素の縦の隙間 */
}

.memo-date-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    color: #a3958d;
    letter-spacing: 0.05em;
}
.memo-input-wrapper {
    border-bottom: 1px dashed #e6dfda;
    padding-bottom: 4px;
}
#daily-memo-input {
    width: 100%;
    font-size: 13px;
    color: #8c7e74;
    padding: 0;
    border: none;         
    background: transparent;
    outline: none;
    font-family: "Times New Roman", "YuMincho", "游明朝", "Hiragino Mincho ProN", "MS Mincho", serif;
    letter-spacing: 0.05em;
    resize: none;         
    height: 3.9em;        
    line-height: 1.4;     
}
#daily-memo-input::placeholder {
    color: #5c4e46;
    font-style: normal;
    opacity: 0.35;
}


        @keyframes fadeInMemo {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

                /* 📍【追加】生理記録スイッチのミニマルデザイン */
        .period-checkbox-label {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #d1c7bd; /* 通常時は主張しない淡い色 */
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        /* 本物のチェックボックスは隠す */
        .period-checkbox-label input {
            display: none;
        }
        /* チェックが入ったとき（📍がセピアグレーに優しく灯る） */
        .period-checkbox-label input:checked + span {
            color: #5c4e46;
            font-weight: 500;
        }

        /* 今日の日付だけをひっそり色濃く */
        .calendar-day.is-today {
            color: #5c4e46; /* 本来の洗練されたセピアグレー */
            font-weight: 500; /* ほんの少しだけ太くして視認性を上げる */
        }
        .calendar-day.empty {
            cursor: default;
        }    
        /* 残高セクション */
        .balance-section {
            margin-bottom: 40px;
        }
        .balance-label {
        font-family: 'Inter', sans-serif;
        font-weight: 300;       /* 🌟 100から300（Light）へ。画像通りのシュッとした存在感を灯す */
        font-size: 16px;        /* 🌟 画像の比率に合わせた、主張しすぎない上品なサイズ */
        color: #a3958d;
        text-transform: uppercase; /* 完璧な大文字固定 */
        letter-spacing: 0.17em;   /* 🌟 広すぎず狭すぎない、元画像通りの美しく凛とした文字間隔 */
        margin-bottom: 4px;
        display: block;         
        text-indent: 0.25em;    /* 中央揃えを美しく保つための隠し味 */
        }
        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 45px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: 300;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s;
        }
        .balance-amount.slide-out {
            transform: translateY(-20px);
            opacity: 0;
        }
        .balance-amount.slide-in-init {
            transform: translateY(20px);
            opacity: 0;
            transition: none;
        }
        .balance-unit {
            font-size: 16px;
            margin-left: 4px;
            color: #a3958d;
            display: inline-block; /* 位置を動かせるようにするおまじない */
            transform: translateY(5px); /* 🌟 2px〜3pxの間で、心地よい位置に下にスライドさせる */    
        }
        /* 入力エリアのグループ */
        .input-group {
    margin: 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px; /* パネルの内側に心地よい余白を作る */
    border-bottom: none; /* 🌟うるさかった下線を消去 */
    
    /* 🌟グラスモーフィズム：1枚の美しい透き通るパネルへ */
    background: rgba(255, 255, 255, 0.03); 
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    }

        /* ダークモード時はすりガラスを夜の静けさに馴染ませる */
        body.theme-dark .input-group {
        background: rgba(16, 25, 48, 0.2);
        border: 1px solid rgba(210, 215, 223, 0.04);
        }

        .input-group label {
            font-size: 14px;
            color: #8c7e74;
            white-space: nowrap;
        }
        input {
    border: none;
    background: transparent;
    text-align: left; /* 🌟右寄せから、凛とした「左寄せ」へ変更 */
    font-size: 15px;
    color: #5c4e46;
    outline: none;
    width: 60%; /* 文字が途切れないように少し広げる */
    padding-left: 8px;
    font-family: inherit;
}


        input::placeholder {
            color: #d1c7bd;
        }

         /* 🌟【修正】数字入力欄（type="number"）の上下矢印を全ブラウザで完全に消し去る */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none !important; /* !important を添えてブラウザの設定を強制上書き */
            margin: 0;
        }
        /* Firefox用の設定もお守りとして追加 */
        input[type="number"] {
            -moz-appearance: textfield;
        }

        button {
            border: none;
            background: transparent;
            color: #8c7e74;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s, opacity 0.2s;
            outline: none;
            font-family: inherit;
            position: relative;
        }
        button:hover {
            color: #bfae9e;
        }
        .undo-btn {
            color: #d1c7bd;
            font-size: 18px;
            padding: 0 4px;
        }
        .undo-btn:hover {
            color: #8c7e74;
        }
        /* ひっそりと佇む履歴エリア */
        .history-section {
            margin-top: 35px; /* 上の入力グループとの心地よい距離 */
            text-align: left;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
            color: #8c7e74; /* 文字色を少しだけ引き締めて視認性を向上 */
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #f2ede9; /* 境界線をさらに淡く、肌馴染みよく */
            padding: 12px 2px; /* 🌟 上下の余白を10pxから12pxに広げて、ゆったりとした空気を纏わせる */
            cursor: pointer;
            transition: background 0.2s;
        }
        /* 🌟 通常モード時のホバー色 */
        .history-item:hover {
            background-color: rgba(210, 215, 223, 0.05);
        }

        /* 🌟 左右の分割から完全に独立させ、ウィンドウの一番下のど真ん中へビシッと固定する調律 */
        #modal-history-list {
            position: absolute !important;      /* 🌟 絶対配置モードをオン */
            bottom: 20px !important;            /* 🌟 ウィンドウの下端から20pxの位置に固定 */
            left: 50% !important;               /* 🌟 一度左端を画面の50%（真ん中）に持ってくる */
            transform: translateX(-50%) !important; /* 🌟 自分の幅の半分だけ左に戻して、完璧な中央揃えへ */
            width: 210px !important;            /* 2段パネルと同じ美しい細幅 */
            max-height: 110px !important;
            overflow-y: auto !important;
            padding: 0 !important;
            margin: 0 !important;
        }


        /* 🌟 1段にまとまったアイテムを細い幅の中で美しく整列させる */
        #modal-history-list .history-item {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 8px 2px !important; 
            border-bottom: 1px dashed rgba(210, 215, 223, 0.04) !important;
            font-size: 12px !important; 
        }


        #modal-history-list .history-memo {
            font-size: 12px !important;
            color: rgba(210, 215, 223, 0.8) !important;
        }

        #modal-history-list .history-date {
            font-size: 9px !important;
            opacity: 0.4;
        }

        #modal-history-list .history-item > span {
            font-size: 13px !important;
            font-weight: 200 !important;
            color: rgba(210, 215, 223, 0.7) !important;
        }


        .history-left {
            display: flex;
            flex-direction: column;
            gap: 4px; /* 🌟 メモと日付の間の隙間を2pxから4pxに広げて、縦の重なりを美しく */
        }
        .history-date {
            font-size: 10px;
            color: #d1c7bd;
        }
        .history-memo {
            font-size: 13px; /* 🌟 12pxから13pxにして、メモ（絵文字など）の愛らしさを引き立てる */
            color: #5c4e46; /* 本来のセピアグレーにして、引き算の主役にする */
        }
        /* 🌟【追加】履歴の「金額」専用のスタイルを定義して洗練させる */
        .history-item > span {
            font-size: 14px;
            font-weight: 300; /* 🌟 フォントを細めにして、数字のノイズ感を限界まで削ぎ落とす */
            color: #8c7e74;
        }
        /* 💔 ほのかに消えるミスト */
        .emoji-mist {
            position: absolute;
            font-size: 20px; 
            pointer-events: none;
            opacity: 1;
            animation: fadeMist 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 999;
            white-space: nowrap;
        }
        @keyframes fadeMist {
            0% { transform: translate(-50%, -50%) scale(0.8); filter: blur(0px); opacity: 0.8; }
            50% { transform: translate(-50%, -100%) scale(1.1); filter: blur(1px); opacity: 0.5; }
            100% { transform: translate(-50%, -130%) scale(1.2); filter: blur(4px); opacity: 0; }
        }
        @keyframes radioPulse {
            0% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
            50% { opacity: 0.85; text-shadow: 0 0 6px rgba(255,255,255,0.7); }
            100% { opacity: 0.2; text-shadow: 0 0 2px rgba(255,255,255,0.2); }
        }


        /* 🌟【追加】スマホの縦長画面（幅768px以下）に完璧に最適化する調律コード */
        @media (max-width: 768px) {
            body {
                padding: 30px 16px; /* スマホ用に上下左右の余白を少しコンパクトに */
            }
            /* 横並びを解除して、縦にすっきりと並べ直す */
            .main-container {
                flex-direction: column;
                gap: 35px; /* 上下のエリアの間の美しい余白 */
                align-items: center;
            }
            /* 左右のカラムをスマホの幅いっぱいに優しく広げる */
            .left-column, .right-column {
                max-width: 100%;
                width: 100%;
            }
            /* スマホの画面幅に合わせて、カレンダーのマスの隙間をほんの少し自動調整 */
            .calendar-grid {
                gap: 12px 0px; 
            }
            /* 予算や引き算入力欄の幅を、スマホの片手操作でも押しやすい黄金比に調整 */
            input {
                width: 50%;
            }
            #memo {
                width: 50% !important;
            }

function checkRadioBroadcast() {
    const now = new Date();
    const dayOfWeek = now.getDay(); // 0:日, 1:月, 2:火, 3:水, 4:木, 5:金, 6:土
    const hours = now.getHours();
    const minutes = now.getMinutes();

    // 💡 24:00（深夜0:00）〜 25:00（深夜1:00）を分単位に換算
    const currentTotalMinutes = (hours * 60) + minutes;
    const startTotalMinutes = (0 * 60) + 0;   // 0時00分
    const endTotalMinutes = (1 * 60) + 0;     // 1時00分

    // 条件1: 毎週「火曜日（2）」かどうか
    const isTuesday = (dayOfWeek === 3);

    // 条件2: ラジオの放送時間中かどうか
    const isBroadcasting = (currentTotalMinutes >= startTotalMinutes && currentTotalMinutes < endTotalMinutes);

    // 条件3: 画面がダークモード（theme-dark）になっているか
    const isDarkMode = document.body.classList.contains('theme-dark');

    const radioEl = document.getElementById('radio-gimmick');
    
    // すべての条件を満たしたときだけ、ご友人の周波数を灯す
    if (isTuesday && isBroadcasting && isDarkMode) {
        radioEl.textContent = "81.3 MHz ON AIR"; 
        radioEl.style.display = 'block';
    } else {
        radioEl.style.display = 'none';
    }
}



// 画面を開いた時と、その後は1分ごとに自動で時間をチェックする
window.addEventListener('DOMContentLoaded', () => {
    checkRadioBroadcast();
    setInterval(checkRadioBroadcast, 60000); 
});

</script>

                        </label>
                    </div>
                </div>
    
                <!-- メモ入力欄（item） -->
                <div class="memo-input-wrapper" style="margin-top: 6px;">
                    <textarea id="daily-memo-input" onblur="saveDailyMemo()" placeholder="item"></textarea>
                </div>
                
            </div>
                       <!-- 🌟【引っ越し先】ここに配置することで、日付の左右分割に巻き込まれず、ウィンドウ全体のど真ん中に配置されます -->
            <ul id="modal-history-list" class="history-list"></ul>
        </div>



<!-- 📥 【カレンダーエリアの一番下にアイコンを配置】 -->
<div style="margin-top: 45px; text-align: right; padding: 0 4px; display: flex; justify-content: flex-end; gap: 18px; font-size: 14px;">
    <!-- 📻 ラジオギミック：優しく明滅するネオンエフェクト付き -->
    <span id="radio-gimmick" style="font-size: 10px; color: #ffffff; letter-spacing: 0.15em; display: none; font-weight: 200; align-self: center; margin-right: auto; padding-left: 4px; text-shadow: 0 0 4px rgba(255,255,255,0.6); animation: radioPulse 3s infinite ease-in-out;">81.3 MHz ON AIR</span>
    <span onclick="exportData()" title="データを保存" style="opacity: 0.35; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.35'">🔐</span>
    <span onclick="importData()" title="データを復元" style="opacity: 0.35; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.35'">🔑</span>
    <span onclick="requestNotificationPermission()" title="通知を許可" style="opacity: 0.35; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.35'">🔔</span>
        </div> <!-- 右カラム（right-column）の閉じタグ -->

    </div>
</div>
<script>

// 🌓 配色テーマ切り替えのプログラム
    let currentTheme = localStorage.getItem('myTheme') || 'light';
    if (currentTheme === 'dark') {
        document.body.classList.add('theme-dark');
    }

    function toggleTheme() {
        if (document.body.classList.contains('theme-dark')) {
            document.body.classList.remove('theme-dark');
            localStorage.setItem('myTheme', 'light');
        } else {
            document.body.classList.add('theme-dark');
            localStorage.setItem('myTheme', 'dark');
        }
        checkRadioBroadcast(); // 📻【ここを1行追加！】
    }


    let currentBalance = Number(localStorage.getItem('myBalance')) || 5000;
    let lastSubtractedAmount = 0;
    let historyLogs = JSON.parse(localStorage.getItem('myHistoryLogs')) || [];
    const emoji = '💔';
    let selectedDateStr = null;
    let dailyMemos = JSON.parse(localStorage.getItem('myDailyMemos')) || {}; 
    let dailyWeathers = JSON.parse(localStorage.getItem('myDailyWeathers')) || {}; 
    let dailyPills = JSON.parse(localStorage.getItem('myDailyPills')) || {};
    let periodStarts = JSON.parse(localStorage.getItem('myPeriodStarts')) || [];
    let periodEnds = JSON.parse(localStorage.getItem('myPeriodEnds')) || [];
    let savedBudgetValue = Number(localStorage.getItem('myBudgetValue')) || 0;
    
        let calendarDate = new Date();
    // 🌟【追加】起動時に今日が「1日」かつ予算が設定されていれば、自動で残高を予算額にリセットする
    const startupToday = new Date();
    if (startupToday.getDate() === 1 && savedBudgetValue > 0) {
        // 前回の自動リセット月と重複していないか簡易チェック（必要なら）
        currentBalance = savedBudgetValue;
        localStorage.setItem('myBalance', currentBalance);
    }

    document.getElementById('balance').textContent = currentBalance.toLocaleString();
    renderHistory();
    renderCalendar(); // カレンダーを描画

    // 🌟 起動時も常に wallet という文字を初期表示する
    document.getElementById('set-budget').placeholder = "wallet";



    function animateBalanceUpdate(newAmount) {
        const balanceEl = document.getElementById('balance');
        balanceEl.classList.add('slide-out');
        setTimeout(() => {
            balanceEl.textContent = newAmount.toLocaleString();
            balanceEl.classList.remove('slide-out');
            balanceEl.classList.add('slide-in-init');
            setTimeout(() => { balanceEl.classList.remove('slide-in-init'); }, 20);
        }, 150);
    }

    function saveToStorage() {
        localStorage.setItem('myBalance', currentBalance);
        localStorage.setItem('myHistoryLogs', JSON.stringify(historyLogs));
    }

    // 🌟【調律】普段の画面（最新3件）とウィンドウ内（その日の全履歴）へ美しくデータを仕分けする関数
    function renderHistory() {
        const mainListEl = document.getElementById('history-list');
        const modalListEl = document.getElementById('modal-history-list');
        
        if (mainListEl) mainListEl.innerHTML = '';
        if (modalListEl) modalListEl.innerHTML = '';

        // 配列を逆順にして、常に最新の書き込みが一番上に来るようにベースのログを用意
        const reversedLogs = historyLogs.slice().reverse();

        // 1️⃣ 普段の画面用：日付の選択状態に関係なく、全体の最新ログから「上位3件だけ」を厳選して描画
        let mainRenderCount = 0;
        reversedLogs.forEach((log) => {
            if (mainRenderCount >= 3) return; // 3件を超えたら引き算（描画ストップ）

            // 元の配列（historyLogs）における正確なインデックスを計算（削除ボタンのバグを防ぐお守り）
            const originalIndex = historyLogs.findIndex(origLog => origLog === log);

            const li = document.createElement('li');
            li.className = 'history-item';
            li.onclick = (event) => deleteHistoryItem(originalIndex, event);
            
            const memoText = log.memo ? log.memo : '';
            li.innerHTML = `
                <div class="history-left">
                    <span class="history-memo">${memoText}</span>
                    <span class="history-date">${log.date}</span>
                </div>
                <span>${log.amount.toLocaleString()}</span>
            `;
            if (mainListEl) mainListEl.appendChild(li);
            mainRenderCount++;
        });

        // 2️⃣ システムウィンドウ用：現在タップして選択されている日付（selectedDateStr）の履歴をすべて描画
        if (selectedDateStr && modalListEl) {
            reversedLogs.forEach((log) => {
                // タップされた日付（例: 2026/10/21）と前方一致するものだけを厳選
                if (!log.date.startsWith(selectedDateStr)) return;

                const originalIndex = historyLogs.findIndex(origLog => origLog === log);

                const li = document.createElement('li');
                li.className = 'history-item';
                // ウィンドウ内の履歴をタップしても、ほのかにミストを出しながら安全に削除できるように
                li.onclick = (event) => deleteHistoryItem(originalIndex, event);
                
                const memoText = log.memo ? log.memo : '';
                // 🌟 横1列（1段）にギュッと凝縮したミニマルな構造へ調律
                li.innerHTML = `
                    <div class="history-left" style="flex-direction: row; align-items: baseline; gap: 6px;">
                        <span class="history-memo">${memoText}</span>
                        <span class="history-date" style="font-size: 9px; opacity: 0.35;">${log.date.split(' ')[1] || ''}</span>
                    </div>
                    <span style="margin-left: auto;">${log.amount.toLocaleString()}</span>
                `;
                modalListEl.appendChild(li);

            });
        }
    }


   // 🌟【修正】マウスの位置（event）を受け取ってミストを出すようにアップデート
    function deleteHistoryItem(index, event) {
        const item = historyLogs[index];
        if (item.type === 'minus') { currentBalance += item.amount; }
        else if (item.type === 'undo') { currentBalance -= item.amount; }
        historyLogs.splice(index, 1);
        animateBalanceUpdate(currentBalance);
        saveToStorage();
        renderHistory();
        renderCalendar();
        
        // 🌟【追加】タップされた場所（event）からミストをほのかに出現させる
        if (event) {
            createEmojiMist(null, event);
        }
    }

    function getCurrentFormattedDate() {
        const now = new Date();
        return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }


  // 🌟【修正】ボタンなしでスマートに自動保存する予算設定関数
    function setBudget() {
        const budgetInputEl = document.getElementById('set-budget');
        const budgetInput = budgetInputEl.value.trim();
        
        // 入力欄が完全に空っぽのままフォーカスが外れたら、何もしない
        if (budgetInput === "") return;
        
        const budgetNum = Number(budgetInput);
        
        // 1. 現在の残高に予算を設定
        currentBalance = budgetNum;
        animateBalanceUpdate(currentBalance);
        
        // 2. 毎月1日のリセット用に、この予算額をマスターとして記憶
        savedBudgetValue = budgetNum;
        localStorage.setItem('myBudgetValue', savedBudgetValue);
        
        // 3. ローカルストレージに残高も保存
        localStorage.setItem('myBalance', currentBalance);
        
        
        // 4. 入力された文字を「するん」と消去し、placeholderは元の文字を常にキープする
        budgetInputEl.value = "";
        budgetInputEl.placeholder = "wallet"; // 🌟ここを固定の文字に直します
    }


        function minusMoney() {
        const inputAmount = document.getElementById('amount').value;
        const memoInput = document.getElementById('memo').value;
        if (inputAmount === "") return;
        const amountNum = Number(inputAmount);
        lastSubtractedAmount = amountNum;
        currentBalance = currentBalance - amountNum;
        animateBalanceUpdate(currentBalance);

        // 🌟【修正】もしカレンダーの日付（座布団）が選択されていたら、その日付をベースにする
        let finalDateStr = getCurrentFormattedDate();
        if (selectedDateStr) {
            const now = new Date();
            // 選択された日付に、現在の「時:分」をひっそりブレンドする
            finalDateStr = `${selectedDateStr} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        historyLogs.push({
            date: finalDateStr, // 🌟 決定された日付を流し込む
            amount: amountNum,
            memo: memoInput,
            type: 'minus'
        });
        saveToStorage();
        renderHistory();
        renderCalendar(); // 🌟【追加】カレンダーも同時に最新の状態に更新する
        document.getElementById('amount').value = "";
        document.getElementById('memo').value = "";
        createEmojiMist(document.getElementById('minus-btn'));
    }

// 🌟【修正】ボタンタップでも、履歴リストのどこをタップしても正確にミストが出るハイブリッド関数
    function createEmojiMist(targetButton, event) {
        const span = document.createElement('span');
        span.textContent = emoji;
        span.className = 'emoji-mist';
        
        if (event) {
            // 🌟履歴タップ時：指で押したまさにその場所（座標）からミストを出す
            span.style.left = (event.pageX) + 'px';
            span.style.top = (event.pageY) + 'px';
        } else if (targetButton) {
            // ボタンタップ時：ボタンの中心からミストを出す（これまで通り）
            const rect = targetButton.getBoundingClientRect();
            span.style.left = (rect.left + window.scrollX + rect.width / 2) + 'px';
            span.style.top = (rect.top + window.scrollY + rect.height / 2) + 'px';
        }
        
        document.body.appendChild(span);
        setTimeout(() => { span.remove(); }, 1200);
    }

    // 指定された月の日付を自動生成して並べる関数
    function renderCalendar() {
        const daysContainer = document.getElementById('calendar-days');
        daysContainer.innerHTML = '';

        // 基準にする日時を calendarDate から取得
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth(); // 0が1月、11が12月

    
        // カレンダーの上のラベルを数字だけの表示に書き換える（0が1月なので +1 する）
        document.getElementById('calendar-month').textContent = month + 1;

        // 1日の曜日（0:日〜6:土）と、今月の最終日を取得
        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        // 1日より前の空白のマスを埋める
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'calendar-day empty';
            daysContainer.appendChild(emptyDiv);
        }
       // 今日の日付を判定するための基準を取得
        const today = new Date();
        const isCurrentYear = year === today.getFullYear();
        const isCurrentMonth = month === today.getMonth();

        // 1日から最終日までの数字を並べる（🌟ここを丸ごと差し替えてください）
        for (let date = 1; date <= lastDate; date++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';
            
            // 🌟【修正】ループの中で毎回新しく数字の部屋を作ることで、31日への上書き家出を防ぎます
            const spanText = document.createElement('span');
            spanText.textContent = date;
            dayDiv.appendChild(spanText);

            // 最新の生理開始日（periodStarts）をもとに、未来の周期（28日後〜32日後）を予測
            if (periodStarts.length > 0) {
                const lastStartStr = periodStarts[periodStarts.length - 1];
                const lastStartDate = new Date(lastStartStr);
                const currentGridDate = new Date(year, month, date);
                const diffTime = currentGridDate - lastStartDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const isNextPeriodPrediction = (diffDays >= 28 && diffDays <= 32) || (diffDays >= 56 && diffDays <= 60);
                
                if (isNextPeriodPrediction) {
                    dayDiv.style.backgroundColor = '#b8cbdc'; 
                    spanText.style.color = '#ffffff'; // 🌟中の文字を白く
                    dayDiv.style.borderRadius = '4px';
                }
            }

            // 日付をタップしたときのイベント
            dayDiv.onclick = () => selectDay(year, month, date);

            // 今日の一致判定
            if (isCurrentYear && isCurrentMonth && date === today.getDate()) {
                dayDiv.classList.add('is-today');
            }

            const currentLoopDateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(date).padStart(2, '0')}`;
            if (selectedDateStr === currentLoopDateStr) {
                dayDiv.classList.add('is-selected');
            }

            if (currentLoopDateStr === "2026/10/07") {
                dayDiv.classList.add('is-special-crown');
            }

            const hasRecord = Array.isArray(historyLogs) && historyLogs.some(log => log && log.type === 'minus' && log.date && log.date.startsWith(currentLoopDateStr));
            if (hasRecord) {
                dayDiv.classList.add('has-dot'); 
            }

            if (dailyMemos[currentLoopDateStr]) {
                dayDiv.classList.add('has-memo-dot'); 
            }

            let isInPeriod = false;
            periodStarts.forEach(startStr => {
                const startDate = new Date(startStr);
                const currentGridDate = new Date(currentLoopDateStr);
                const nextEndStr = periodEnds.find(endStr => endStr >= startStr);
                
                if (nextEndStr) {
                    const endDate = new Date(nextEndStr);
                    if (currentGridDate >= startDate && currentGridDate <= endDate) {
                        isInPeriod = true;
                    }
                } else {
                    if (currentLoopDateStr === startStr) {
                        isInPeriod = true;
                    }
                }
            });

            if (isInPeriod) {
                dayDiv.classList.add('is-period-start');
            }

            dayDiv.appendChild(spanText); // 🌟数字をマスの内側にしっかりと閉じ込めます
            daysContainer.appendChild(dayDiv);
        }

    }
    // 月を切り替える関数（-1 で前月、1 で来月）
    function changeMonth(offset) {
        // 現在の表示月から offset 分だけ月をズラす
        calendarDate.setMonth(calendarDate.getMonth() + offset);
        renderCalendar(); // 新しい年月でカレンダーを再描画
    }

    // 🌟【調律】ウィンドウとクッション幕を完璧に連動させる日付選択関数
    function selectDay(year, month, date) {
        const targetStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(date).padStart(2, '0')}`;
        const memoSection = document.getElementById('daily-memo-section');
        const overlay = document.getElementById('modal-overlay');
        const memoInput = document.getElementById('daily-memo-input');

        if (selectedDateStr === targetStr) {
            closeMemoModal(); // すでに開いている日なら閉じる
        } else {
            selectedDateStr = targetStr;
            document.getElementById('selected-day-number').textContent = String(date).padStart(2, '0');
            
            // ウィンドウと外側タップ用クッションを同時に灯す
            memoSection.style.display = 'flex';
            overlay.style.display = 'block';
            
            memoInput.value = dailyMemos[targetStr] || '';
            const startCheckbox = document.getElementById('period-start-checkbox');
            const endCheckbox = document.getElementById('period-end-checkbox');
            if (startCheckbox) startCheckbox.checked = periodStarts.includes(targetStr);
            if (endCheckbox) endCheckbox.checked = periodEnds.includes(targetStr);
            
            const savedWeather = dailyWeathers[targetStr];  
            document.querySelectorAll('#weather-select-group span').forEach(el => el.classList.remove('is-weather-selected'));
            if (savedWeather) {
                const activeWeatherEl = document.getElementById(`we-${savedWeather}`);
                if (activeWeatherEl) activeWeatherEl.classList.add('is-weather-selected');
            }

            const pillsSwitchEl = document.getElementById('pills-switch');
            if (dailyPills[targetStr]) {
                pillsSwitchEl.classList.add('is-pills-selected');
            } else {
                pillsSwitchEl.classList.remove('is-pills-selected');
            }
        }
        renderCalendar();
        renderHistory();
    }

    // 🌟【追加】外側をタップした時にウィンドウを跡形もなく美しく閉じる関数
    function closeMemoModal() {
        selectedDateStr = null;
        document.getElementById('daily-memo-section').style.display = 'none';
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('daily-memo-input').value = '';
        renderCalendar();
        renderHistory();
    }


    // 🌟【追加】入力された体調・お薬メモを自動でローカルストレージに保存する関数
    function saveDailyMemo() {
        if (!selectedDateStr) return;
        
        const memoInput = document.getElementById('daily-memo-input');
        const text = memoInput.value.trim();
        
        if (text === '') {
            // 中身が空っぽになったら、データサイズを増やさないよう綺麗に削除する
            delete dailyMemos[selectedDateStr];
        } else {
            // その日付のキーにメモテキストを保存
            dailyMemos[selectedDateStr] = text;
        }
        
        // ローカルストレージに記憶させる
        localStorage.setItem('myDailyMemos', JSON.stringify(dailyMemos));
        renderCalendar();
        syncMemoToLockScreen(); // 🌟【追加】文字を入力してフォーカスが外れた瞬間、自動でAndroidの通知へ飛ばす
    }

    // 🌟【追加】開始チェックボックスが動いたとき
    function savePeriodStart() {
        if (!selectedDateStr) return;
        const checkbox = document.getElementById('period-start-checkbox');
        
        if (checkbox.checked) {
            if (!periodStarts.includes(selectedDateStr)) periodStarts.push(selectedDateStr);
        } else {
            periodStarts = periodStarts.filter(date => date !== selectedDateStr);
        }
        periodStarts.sort();
        localStorage.setItem('myPeriodStarts', JSON.stringify(periodStarts));
        renderCalendar();
    }

    // 🌟【追加】終了チェックボックスが動いたとき
    function savePeriodEnd() {
        if (!selectedDateStr) return;
        const checkbox = document.getElementById('period-end-checkbox');
        
        if (checkbox.checked) {
            if (!periodEnds.includes(selectedDateStr)) periodEnds.push(selectedDateStr);
        } else {
            periodEnds = periodEnds.filter(date => date !== selectedDateStr);
        }
        periodEnds.sort();
        localStorage.setItem('myPeriodEnds', JSON.stringify(periodEnds));
        renderCalendar();
    }

    // ☀️ タップされた天気を記憶・消去するスマート関数
    function selectWeather(weatherEmoji) {
        if (!selectedDateStr) return;

        const currentSaved = dailyWeathers[selectedDateStr];
        
        // すでに同じ天気が選ばれていたら消去（トグル挙動）
        if (currentSaved === weatherEmoji) {
            delete dailyWeathers[selectedDateStr];
        } else {
            dailyWeathers[selectedDateStr] = weatherEmoji;
        }

        // ローカルストレージに記憶
        localStorage.setItem('myDailyWeathers', JSON.stringify(dailyWeathers));

        // 選択状態の見た目をリアルタイム更新
        document.querySelectorAll('#weather-select-group span').forEach(el => el.classList.remove('is-weather-selected'));
        const newSaved = dailyWeathers[selectedDateStr];
        if (newSaved) {
            document.getElementById(`we-${newSaved}`).classList.add('is-weather-selected');
        }
        
        renderCalendar(); // カレンダー側にも変化を出したい時のために再描画
    }

    function togglePillsReminder() {
    if (!selectedDateStr) return;

    const pillsSwitchEl = document.getElementById('pills-switch');
    
    if (dailyPills[selectedDateStr]) {
        // すでにONなら消去
        delete dailyPills[selectedDateStr];
        pillsSwitchEl.classList.remove('is-pills-selected');
    } else {
        // OFFならONにする
        dailyPills[selectedDateStr] = true;
        pillsSwitchEl.classList.add('is-pills-selected');
    }

    localStorage.setItem('myDailyPills', JSON.stringify(dailyPills));
    renderCalendar(); // カレンダー側にも変化を出したい時のために再描画
}


function checkPillsReminder() {
    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}/${String(todayObj.getMonth() + 1).padStart(2, '0')}/${String(todayObj.getDate()).padStart(2, '0')}`;
    
    // 今日の日付でお薬スイッチがON（true）になっていたら優しく灯す
    if (dailyPills && dailyPills[todayStr]) {

        const toast = document.createElement('div');
        toast.className = 'pills-reminder-toast';
        toast.textContent = 'take it easy. ✿'; 
        
        document.body.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 4500);
    }
}


// ページが読み込まれたら自動で実行する（既存のコードの起動処理にブレンド）
window.addEventListener('DOMContentLoaded', () => {

    setTimeout(checkPillsReminder, 600);
});

// 🔒【修正】すべてのデータを1つのテキストファイル（.txt）として出力する
function exportData() {
    const allData = {
        balance: localStorage.getItem('myBalance'),
        historyLogs: localStorage.getItem('myHistoryLogs'),
        dailyMemos: localStorage.getItem('myDailyMemos'),
        dailyWeathers: localStorage.getItem('myDailyWeathers'),
        periodStarts: localStorage.getItem('myPeriodStarts'),
        periodEnds: localStorage.getItem('myPeriodEnds'),
        budgetValue: localStorage.getItem('myBudgetValue')
    };
    
    // text/plain に変更してテキストファイルとして出力
    const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
    const downloadAnchor = document.createElement('a');
    
    const now = new Date();
    const dateSlot = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
    
    downloadAnchor.setAttribute("href", dataStr);
    // ファイル名を lucca_backup_日付.txt に変更
    downloadAnchor.setAttribute("download", `lucca_backup_${dateSlot}.txt`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// 🔒【修正】拡張子 .txt ファイルを読み込んでデータを完全に復元する
function importData() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    // .txt ファイルのみ受け付けるように変更
    fileInput.accept = '.txt';
    
    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = event => {
            try {
                const imported = JSON.parse(event.target.result);
                
                if (imported.balance) localStorage.setItem('myBalance', imported.balance);
                if (imported.historyLogs) localStorage.setItem('myHistoryLogs', imported.historyLogs);
                if (imported.dailyMemos) localStorage.setItem('myDailyMemos', imported.dailyMemos);
                if (imported.dailyWeathers) localStorage.setItem('myDailyWeathers', imported.dailyWeathers);
                if (imported.periodStarts) localStorage.setItem('myPeriodStarts', imported.periodStarts);
                if (imported.periodEnds) localStorage.setItem('myPeriodEnds', imported.periodEnds);
                if (imported.budgetValue) localStorage.setItem('myBudgetValue', imported.budgetValue);
                
                alert('データを復元しました。再読み込みします。');
                window.location.reload();
                
            } catch (err) {
                alert('ファイルの形式が正しくないようです。');
            }
        };
        reader.readAsText(file);
    };
    
    fileInput.click();
}

// 🌟【Android専用】スマホのロック画面に通知を届けるためのコアプログラム
function requestNotificationPermission() {
    if (!('Notification' in window)) {
        alert('このブラウザは通知に対応していません。');
        return;
    }
    Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
            alert('通知が許可されました！');
            // 許可された瞬間に、Androidのロック画面へ最初のテスト通知を飛ばす
            sendAndroidNotification('lucca', 'いつでもメモをここに灯します。✿');
        } else {
            alert('通知がブロックされました。設定から許可してください。');
        }
    });
}

function sendAndroidNotification(title, message) {
    if ('Notification' in window && Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(registration => {
            registration.showNotification(title, {
                body: message,
                icon: 'https://flaticon.com', 
                badge: 'https://flaticon.com', 
                vibrate:[100, 50, 100], /* 🌟 トントンと2回小気味よく震わせて存在感をアピール */
                requireInteraction: true, /* 🌟 ユーザーが消すまで、ロック画面や通知欄にずっと常駐させる */
                
                // 👇【最重要】Androidシステムに「最優先（High）」で表示させるための隠し味
                tag: 'lucca-status-notification', /* 常に1つの通知を上書き常駐させるための目印 */
                renotify: true, /* メモが更新されたら、もう一度スマホをパッと点灯させる */
                data: {
                    priority: 'high' /* システムへの優先度要求 */
                }
            });
        });
    }
}


// 🌟【調律】ウィンドウでメモを保存した瞬間に、Androidのロック画面へ通知を同期する
function syncMemoToLockScreen() {
    if (!selectedDateStr) return;
    const memoText = document.getElementById('daily-memo-input').value.trim();
    
    if (memoText !== '') {
        const cleanDate = selectedDateStr.split('/')[1] + '/' + selectedDateStr.split('/')[2]; // 「10/21」の形にすっきり整える
        sendAndroidNotification(`lucca : ${cleanDate}`, memoText);
    }
}
