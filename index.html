<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lucca</title>
 <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="lucca">
    <link rel="apple-touch-icon" href="https://flaticon.com">
    <style>
                body {
            background-color: #ffffff;
            color: #5c4e46; /* 柔らかく洗練されたセピアグレー */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 60px 20px;
            text-align: center;
            overflow-x: hidden; 
            letter-spacing: 0.08em;
        }
        .wrapper {
            max-width: 700px; /* 横並び用に幅を拡張 */
            margin: 0 auto;
            position: relative;
        }
        /* 横並び用のレイアウトコンテナ */
        .main-container {
            display: flex;
            gap: 50px; /* エリア間の美しい余白 */
            justify-content: center;
            align-items: flex-start;
            margin-top: 30px;
        }
        .left-column {
            flex: 1;
            max-width: 320px;
        }
        .right-column {
            flex: 1;
            max-width: 320px;
        }
        /* カレンダーの月の数字専用スタイル */
        .calendar-month-text {
            font-size: 24px;       /* 数字を心地よい大きさに拡張 */
            font-weight: 300;      /* 太さを細くしてノイズ感を抑える */
            color: #5c4e46;        /* 落ち着いたセピアグレー */
            letter-spacing: 0.02em;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px 8px;
            margin-top: 15px;
        }
        .weekday-label {
            font-size: 11px;
            color: #d1c7bd; /* 柔らかく主張しない色 */
            font-weight: 300;
            text-transform: uppercase;
        }
        .calendar-day {
        font-size: 12px;
            color: #bfae9e; /* 通常の数字を少し淡くしてノイズを減らす */
            font-weight: 300;
            width: 28px;
            height: 28px; /* ドットが入るスペースを確保するために少し高さを広げる */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-sizing: border-box; /* 🌟【追加】サイズ計算を均一に固定する */
            margin: 0 auto;         /* 🌟【追加】グリッドのマス目の中で綺麗に中央に佇ませる */
        }
        /* 支出がある日にひっそり灯るドット */
        .calendar-day.has-dot::after {
            content: '•';
            font-size: 10px;
            color: #8c7e74;
            position: absolute;
            bottom: -4px;
            left: calc(50% - 4px); /* 中央から4pxだけ左にずらす */
            transform: translateX(-50%);
            line-height: 1;
        }
        /* 名前の衝突を防ぐため、クラスを重ねて after の右側にピンクを灯す */
        .calendar-day.has-memo-dot:not(.has-dot)::after {
            content: '•';
            font-size: 10px;
            color: #e3b3b3;
            position: absolute;
            bottom: -4px;
            left: calc(50% + 4px); /* 中央から4pxだけ右にずらす */
            transform: translateX(-50%);
            line-height: 1;
        }
        /* グレーとピンクが「両方ある日」は、美しく横並びする2つのドット */
        .calendar-day.has-dot.has-memo-dot::after {
            content: '••';
            font-size: 10px;
            letter-spacing: 4px;
            position: absolute;
            bottom: -4px;
            left: calc(50% + 2px);
            transform: translateX(-50%);
            background: linear-gradient(to right, #8c7e74 50%, #e3b3b3 50%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }  
        /* 🌟 生理期間中にひっそりピン留めされる「📍」マーク（干渉しないよう before に統一） */
        .calendar-day.is-period-start::before {
            content: '📍';
            font-size: 9px;
            position: absolute;
            top: -1px; /* 右上の美しい位置に配置 */
            right: -1px;
            line-height: 1;
            z-index: 2;
        }

        /* 👑 10月7日の特別な日だけに左上に灯る王冠 */
        .calendar-day.is-special-crown::after {
            content: '👑' !important; /* 既存のドットを上書きして王冠を優先 */
            font-size: 8px;           /* 📍よりほんの少し小さく上品に */
            position: absolute;
            top: -1px;                /* 📍と同じ高さに揃える */
            left: -1px;               /* 👈 左上の美しい位置に配置 */
            right: auto !important;   /* 右側を解除 */
            line-height: 1;
            z-index: 2;
            color: initial;
            background: none !important;
            -webkit-text-fill-color: initial !important;
        }

        /* カレンダーの日付が選択されたとき（文字色と太さだけを変える） */
        .calendar-day.is-selected {
            color: #5c4e46;
            font-weight: 500;
            position: relative;
        }
        /* 選択されたとき、中の数字を動かさずに「背景だけ（長方形座布団）」を敷く */
        .calendar-day.is-selected::before {
            content: '';
            position: absolute;
            top: 3px;             /* 上端は真四角の位置にピタッと固定 */
            left: 0;
            width: 28px;          /* 横幅をマスのサイズ（28px）にピッタリ合わせる */
            height: 30px;         /* 縦幅を30pxにして、下側だけに2pxはみ出させる */
            background-color: #f4ede7; /* 肌馴染みの良いごく淡いベージュグレー */
            border-radius: 4px;   /* ほんのり丸い四角 */
            z-index: -1;          /* 背景色を数字の「後ろ」に回り込ませる */
        }

        /* 🌟 注意：ここに残っていた「.calendar-day.is-period-start::after」の重複コードは綺麗に削除しました */

        /* 🌟【追加】体調・お薬メモのミニマルなデザイン */
        .daily-memo-section {
            margin-top: 25px;
            text-align: left;
            padding: 0 4px;
            animation: fadeInMemo 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .memo-date-label {
            font-size: 11px;
            color: #a3958d;
            display: block;
            margin-bottom: 6px;
        }
        .memo-input-wrapper {
            border-bottom: 1px dashed #e6dfda;
            padding-bottom: 4px;
        }
        #daily-memo-input {
            width: 100%;
            text-align: left;
            font-size: 13px;
            color: #5c4e46;
            padding: 0;
            border: none;         /* 枠線を完全に消去 */
            background: transparent;
            outline: none;
            font-family: inherit;
            resize: none;         /* 右下のサイズ変更ツマミを消して美しさを固定 */
            height: 3.9em;        /* 13px × 3行分（約3.9文字分）の高さに固定 */
            line-height: 1.3;     /* 行間を心地よく調律 */
        }

        #daily-memo-input::placeholder {
            color: #d1c7bd;
            font-style: italic;
        }
        @keyframes fadeInMemo {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

                /* 📍【追加】生理記録スイッチのミニマルデザイン */
        .period-checkbox-label {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #d1c7bd; /* 通常時は主張しない淡い色 */
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        /* 本物のチェックボックスは隠す */
        .period-checkbox-label input {
            display: none;
        }
        /* チェックが入ったとき（📍がセピアグレーに優しく灯る） */
        .period-checkbox-label input:checked + span {
            color: #5c4e46;
            font-weight: 500;
        }

        /* 今日の日付だけをひっそり色濃く */
        .calendar-day.is-today {
            color: #5c4e46; /* 本来の洗練されたセピアグレー */
            font-weight: 500; /* ほんの少しだけ太くして視認性を上げる */
        }
        .calendar-day.empty {
            cursor: default;
        }    
        /* 残高セクション */
        .balance-section {
            margin-bottom: 50px;
        }
        .balance-label {
            font-size: 13px;
            color: #a3958d;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }
        .balance-container {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 45px;
        }
        .balance-amount {
            font-size: 36px;
            font-weight: 300;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s;
        }
        .balance-amount.slide-out {
            transform: translateY(-20px);
            opacity: 0;
        }
        .balance-amount.slide-in-init {
            transform: translateY(20px);
            opacity: 0;
            transition: none;
        }
        .balance-unit {
            font-size: 16px;
            margin-left: 4px;
            color: #a3958d;
            display: inline-block; /* 位置を動かせるようにするおまじない */
            transform: translateY(5px); /* 🌟 2px〜3pxの間で、心地よい位置に下にスライドさせる */    
        }
        /* 入力エリアのグループ */
        .input-group {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f2ede9;
            padding-bottom: 8px;
        }
        .input-group label {
            font-size: 14px;
            color: #8c7e74;
            white-space: nowrap;
        }
        input {
            border: none;
            background: transparent;
            text-align: right;
            font-size: 16px;
            color: #5c4e46;
            outline: none;
            width: 40%;
            padding-right: 5px;
            font-family: inherit;
        }
        input::placeholder {
            color: #d1c7bd;
        }

         /* 🌟【修正】数字入力欄（type="number"）の上下矢印を全ブラウザで完全に消し去る */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none !important; /* !important を添えてブラウザの設定を強制上書き */
            margin: 0;
        }
        /* Firefox用の設定もお守りとして追加 */
        input[type="number"] {
            -moz-appearance: textfield;
        }

        button {
            border: none;
            background: transparent;
            color: #8c7e74;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s, opacity 0.2s;
            outline: none;
            font-family: inherit;
            position: relative;
        }
        button:hover {
            color: #bfae9e;
        }
        .undo-btn {
            color: #d1c7bd;
            font-size: 18px;
            padding: 0 4px;
        }
        .undo-btn:hover {
            color: #8c7e74;
        }
        /* ひっそりと佇む履歴エリア */
        .history-section {
            margin-top: 35px; /* 上の入力グループとの心地よい距離 */
            text-align: left;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
            color: #8c7e74; /* 文字色を少しだけ引き締めて視認性を向上 */
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #f2ede9; /* 境界線をさらに淡く、肌馴染みよく */
            padding: 12px 2px; /* 🌟 上下の余白を10pxから12pxに広げて、ゆったりとした空気を纏わせる */
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover {
            background-color: #fffbf9;
        }
        .history-left {
            display: flex;
            flex-direction: column;
            gap: 4px; /* 🌟 メモと日付の間の隙間を2pxから4pxに広げて、縦の重なりを美しく */
        }
        .history-date {
            font-size: 10px;
            color: #d1c7bd;
        }
        .history-memo {
            font-size: 13px; /* 🌟 12pxから13pxにして、メモ（絵文字など）の愛らしさを引き立てる */
            color: #5c4e46; /* 本来のセピアグレーにして、引き算の主役にする */
        }
        /* 🌟【追加】履歴の「金額」専用のスタイルを定義して洗練させる */
        .history-item > span {
            font-size: 14px;
            font-weight: 300; /* 🌟 フォントを細めにして、数字のノイズ感を限界まで削ぎ落とす */
            color: #8c7e74;
        }
        /* 💔 ほのかに消えるミスト */
        .emoji-mist {
            position: absolute;
            font-size: 20px; 
            pointer-events: none;
            opacity: 1;
            animation: fadeMist 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 999;
            white-space: nowrap;
        }
        @keyframes fadeMist {
            0% { transform: translate(-50%, -50%) scale(0.8); filter: blur(0px); opacity: 0.8; }
            50% { transform: translate(-50%, -100%) scale(1.1); filter: blur(1px); opacity: 0.5; }
            100% { transform: translate(-50%, -130%) scale(1.2); filter: blur(4px); opacity: 0; }
        }

        /* 🌟【追加】スマホの縦長画面（幅768px以下）に完璧に最適化する調律コード */
        @media (max-width: 768px) {
            body {
                padding: 30px 16px; /* スマホ用に上下左右の余白を少しコンパクトに */
            }
            /* 横並びを解除して、縦にすっきりと並べ直す */
            .main-container {
                flex-direction: column;
                gap: 35px; /* 上下のエリアの間の美しい余白 */
                align-items: center;
            }
            /* 左右のカラムをスマホの幅いっぱいに優しく広げる */
            .left-column, .right-column {
                max-width: 100%;
                width: 100%;
            }
            /* スマホの画面幅に合わせて、カレンダーのマスの隙間をほんの少し自動調整 */
            .calendar-grid {
                gap: 12px 0px; 
            }
            /* 予算や引き算入力欄の幅を、スマホの片手操作でも押しやすい黄金比に調整 */
            input {
                width: 50%;
            }
            #memo {
                width: 50% !important;
            }
            #amount {
                width: 30% !important;
            }
        }
        /* ☀️ 選択された天気だけを優しく浮き上がらせる */
        #weather-select-group span {
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
        }
        #weather-select-group span.is-weather-selected {
            opacity: 1 !important;
            transform: scale(1.15);
        }

        /* 2つ以上、または3つすべてのドットが同時に灯る日のマルチドット調律 */
        .calendar-day.multi-dots::after {
            content: attr(data-dots); /* JavaScriptから渡されたドットの文字をそのまま表示 */
            font-size: 10px;
            letter-spacing: 2px; /* 複数並んだ時の美しい間隔 */
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            line-height: 1;
            background: none !important;
            -webkit-background-clip: initial !important;
            -webkit-text-fill-color: initial !important;
            color: #8c7e74; /* 基本はセピアグレー */
        }

        /* ☀️ 天気アイコンの基本スタイル（通常は極薄、選択で浮かび上がる） */
        #weather-select-group span {
            opacity: 0.25; /* 画面に馴染むよう、より淡くひっそりと */
            transition: opacity 0.2s, transform 0.2s;
            display: inline-block;
        }
        #weather-select-group span.is-weather-selected {
            opacity: 1 !important;
            transform: scale(1.2); /* 選択時は少し大きくなって愛らしく */
        }
/* 💊 ひっそりお薬通知のミニマルスタイル */
.pills-reminder-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background-color: #f4ede7; /* 肌馴染みの良い淡いベージュグレー */
    color: #8c7e74;            /* 落ち着いたセピアグレー */
    font-size: 12px;
    padding: 10px 20px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(92, 78, 70, 0.06);
    animation: fadeToast 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes fadeToast {
    0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
    10% { transform: translateX(-50%) translateY(0); opacity: 1; }
    80% { transform: translateX(-50%) translateY(0); opacity: 1; filter: blur(0px); }
    100% { transform: translateX(-50%) translateY(-10px); opacity: 0; filter: blur(2px); }
}

    </style>

<body>
<div class="wrapper">
    <div class="balance-section">
        <span class="balance-label">lucca</span>
        <div class="balance-container">
            <span id="balance" class="balance-amount">0</span>
            <span class="balance-unit">円</span>
        </div>
    </div>
    <!-- 左右に並べるためのコンテナ -->
     <div class="main-container">
        <!-- 左側：計算エリア -->
        <div class="left-column">
           <div class="input-group" style="margin-top: 0;">
                <label>予算</label>
                <!-- 🌟【修正】ボタンを消し、フォーカスが外れたら自動保存（onblur）する挙動へ -->
                <input type="number" id="set-budget" placeholder="未設定" onblur="setBudget()">
            </div>    
            <div class="input-group">
                <input type="text" id="memo" placeholder="✒️" style="text-align: left; width: 45%;">
                <input type="number" id="amount" placeholder="0" style="width: 35%;">
                <div style="display: flex; align-items: center;">
            <button id="minus-btn" onclick="minusMoney()" style="font-size: 18px; font-weight: 300;">＋</button>
                </div>
            </div>
                        <div class="history-section" style="margin-top: 30px;"> <!-- 上の余白を少しマイルドに調整 -->
                <ul id="history-list" class="history-list"></ul>
            </div>

          <!-- 🔒【追加】ひっそりと佇むバックアップ・復元エリア（アイコン版） -->
<div style="margin-top: 45px; text-align: left; padding: 0 2px; display: flex; gap: 18px; font-size: 14px;">
    <span onclick="exportData()" title="データを保存" style="opacity: 0.35; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.35'">🔐</span>
    <span onclick="importData()" title="データを復元" style="opacity: 0.35; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='0.35'">🔑</span>
</div>

        </div>


        
        <div class="right-column">
         <!-- 月名と切り替えボタンを美しく並べるヘッダー -->
            <div style="display: flex; align-items: baseline; margin-bottom: 15px; padding-left: 4px;">
            <!-- 月の数字を左端にピタッと配置（Sの真上に揃える） -->
                <span id="calendar-month" class="calendar-month-text" style="line-height: 1;"></span>
            <!-- 切り替えボタンを右端にひっそり配置してバランスを取る -->
            <div style="display: flex; gap: 15px; margin-left: auto; padding-right: 4px;">
                    <button onclick="changeMonth(-1)" style="font-size: 12px; color: #d1c7bd; padding: 0;">〈</button>
                    <button onclick="changeMonth(1)" style="font-size: 12px; color: #d1c7bd; padding: 0;">〉</button>
                </div>
            </div>
            <div class="calendar-grid">
                <div class="weekday-label">S</div>
                <div class="weekday-label">M</div>
                <div class="weekday-label">T</div>
                <div class="weekday-label">W</div>
                <div class="weekday-label">T</div>
                <div class="weekday-label">F</div>
                <div class="weekday-label">S</div>

                <!-- JSで日付を流し込むためのコンテナ -->
                <div id="calendar-days" style="display: grid; grid-template-columns: repeat(7, 1fr); grid-column: span 7; gap: 12px 8px; margin-top: 10px;"></div>
            </div>

        <!-- 🌟 ひっそりと佇むその日の記録エリア（3段レイアウトで調律） -->
            <div id="daily-memo-section" class="daily-memo-section" style="display: none;">
                
                <!-- 1段目：日付ラベル ＆ 生理スイッチ -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span id="selected-day-label" class="memo-date-label" style="margin-bottom: 0;">10/07のきろく</span>
                    
                    <div style="display: flex; gap: 12px;">
                        <label class="period-checkbox-label">
                            <input type="checkbox" id="period-start-checkbox" onchange="savePeriodStart()">
                            <span>📍 開始</span>
                        </label>
                        <label class="period-checkbox-label">
                            <input type="checkbox" id="period-end-checkbox" onchange="savePeriodEnd()">
                            <span>終了</span>
                        </label>
                    </div>
                </div>
                
                <!-- 2段目：☀️ お天気選択（文字化けを防ぐため少し隙間を開ける） -->
                <div style="display: flex; align-items: center; margin-bottom: 16px; padding-left: 2px;">
                    <div id="weather-select-group" style="display: flex; gap: 14px; font-size: 15px;">
                        <span onclick="selectWeather('☀️')" id="we-☀️" style="cursor: pointer;">☀️</span>
                        <span onclick="selectWeather('☁️')" id="we-☁️" style="cursor: pointer;">☁️</span>
                        <span onclick="selectWeather('☂️')" id="we-☂️" style="cursor: pointer;">☂️</span>
                        <span onclick="selectWeather('☃️')" id="we-☃️" style="cursor: pointer;">☃️</span>
                    </div>
                </div>
                
                <!-- 3段目：💊 メモ入力欄 -->
                <div class="memo-input-wrapper">
                     <textarea id="daily-memo-input" placeholder="体調や💊のメモ..." onblur="saveDailyMemo()"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    let currentBalance = Number(localStorage.getItem('myBalance')) || 900000000;
    let lastSubtractedAmount = 0;
    let historyLogs = JSON.parse(localStorage.getItem('myHistoryLogs')) || [];
    const emoji = '💔';
    let selectedDateStr = null;
    let dailyMemos = JSON.parse(localStorage.getItem('myDailyMemos')) || {}; 
    let dailyWeathers = JSON.parse(localStorage.getItem('myDailyWeathers')) || {}; 
    let periodStarts = JSON.parse(localStorage.getItem('myPeriodStarts')) || [];
    let periodEnds = JSON.parse(localStorage.getItem('myPeriodEnds')) || [];
    let savedBudgetValue = Number(localStorage.getItem('myBudgetValue')) || 0;

    // カレンダーが現在表示している年月を管理する変数（初期値は現在のブラウザ日時）
    let calendarDate = new Date();
    // 🌟【追加】起動時に今日が「1日」かつ予算が設定されていれば、自動で残高を予算額にリセットする
    const startupToday = new Date();
    if (startupToday.getDate() === 1 && savedBudgetValue > 0) {
        // 前回の自動リセット月と重複していないか簡易チェック（必要なら）
        currentBalance = savedBudgetValue;
        localStorage.setItem('myBalance', currentBalance);
    }

    document.getElementById('balance').textContent = currentBalance.toLocaleString();
    renderHistory();
    renderCalendar(); // カレンダーを描画

    // 🌟【追加】起動時、すでに予算が設定されていれば入力欄の薄い文字（placeholder）にその金額を灯す
    if (savedBudgetValue > 0) {
        document.getElementById('set-budget').placeholder = savedBudgetValue.toLocaleString();
    }


    function animateBalanceUpdate(newAmount) {
        const balanceEl = document.getElementById('balance');
        balanceEl.classList.add('slide-out');
        setTimeout(() => {
            balanceEl.textContent = newAmount.toLocaleString();
            balanceEl.classList.remove('slide-out');
            balanceEl.classList.add('slide-in-init');
            setTimeout(() => { balanceEl.classList.remove('slide-in-init'); }, 20);
        }, 150);
    }

    function saveToStorage() {
        localStorage.setItem('myBalance', currentBalance);
        localStorage.setItem('myHistoryLogs', JSON.stringify(historyLogs));
    }

    function renderHistory() {
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = '';
        historyLogs.slice().reverse().forEach((log, index) => {
            const actualIndex = historyLogs.length - 1 - index;
            if (selectedDateStr && !log.date.startsWith(selectedDateStr)) {
                return;
            }

            const li = document.createElement('li');
            li.className = 'history-item';
            li.onclick = (event) => deleteHistoryItem(actualIndex, event);
            const displayAmount = `${log.amount.toLocaleString()} 円`;
            const memoText = log.memo ? log.memo : '';
            li.innerHTML = `
                <div class="history-left">
                    <span class="history-memo">${memoText}</span>
                    <span class="history-date">${log.date}</span>
                </div>
                <span>${displayAmount}</span>
            `;
            listEl.appendChild(li);
        });
    }

   // 🌟【修正】マウスの位置（event）を受け取ってミストを出すようにアップデート
    function deleteHistoryItem(index, event) {
        const item = historyLogs[index];
        if (item.type === 'minus') { currentBalance += item.amount; }
        else if (item.type === 'undo') { currentBalance -= item.amount; }
        historyLogs.splice(index, 1);
        animateBalanceUpdate(currentBalance);
        saveToStorage();
        renderHistory();
        renderCalendar();
        
        // 🌟【追加】タップされた場所（event）からミストをほのかに出現させる
        if (event) {
            createEmojiMist(null, event);
        }
    }

    function getCurrentFormattedDate() {
        const now = new Date();
        return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }


  // 🌟【修正】ボタンなしでスマートに自動保存する予算設定関数
    function setBudget() {
        const budgetInputEl = document.getElementById('set-budget');
        const budgetInput = budgetInputEl.value.trim();
        
        // 入力欄が完全に空っぽのままフォーカスが外れたら、何もしない
        if (budgetInput === "") return;
        
        const budgetNum = Number(budgetInput);
        
        // 1. 現在の残高に予算を設定
        currentBalance = budgetNum;
        animateBalanceUpdate(currentBalance);
        
        // 2. 毎月1日のリセット用に、この予算額をマスターとして記憶
        savedBudgetValue = budgetNum;
        localStorage.setItem('myBudgetValue', savedBudgetValue);
        
        // 3. ローカルストレージに残高も保存
        localStorage.setItem('myBalance', currentBalance);
        
        // 4. 入力された文字を「するん」と消去し、代わりに薄い文字（placeholder）として記憶を残す
        budgetInputEl.value = "";
        budgetInputEl.placeholder = savedBudgetValue.toLocaleString();
    }

        function minusMoney() {
        const inputAmount = document.getElementById('amount').value;
        const memoInput = document.getElementById('memo').value;
        if (inputAmount === "") return;
        const amountNum = Number(inputAmount);
        lastSubtractedAmount = amountNum;
        currentBalance = currentBalance - amountNum;
        animateBalanceUpdate(currentBalance);

        // 🌟【修正】もしカレンダーの日付（座布団）が選択されていたら、その日付をベースにする
        let finalDateStr = getCurrentFormattedDate();
        if (selectedDateStr) {
            const now = new Date();
            // 選択された日付に、現在の「時:分」をひっそりブレンドする
            finalDateStr = `${selectedDateStr} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        historyLogs.push({
            date: finalDateStr, // 🌟 決定された日付を流し込む
            amount: amountNum,
            memo: memoInput,
            type: 'minus'
        });
        saveToStorage();
        renderHistory();
        renderCalendar(); // 🌟【追加】カレンダーも同時に最新の状態に更新する
        document.getElementById('amount').value = "";
        document.getElementById('memo').value = "";
        createEmojiMist(document.getElementById('minus-btn'));
    }

// 🌟【修正】ボタンタップでも、履歴リストのどこをタップしても正確にミストが出るハイブリッド関数
    function createEmojiMist(targetButton, event) {
        const span = document.createElement('span');
        span.textContent = emoji;
        span.className = 'emoji-mist';
        
        if (event) {
            // 🌟履歴タップ時：指で押したまさにその場所（座標）からミストを出す
            span.style.left = (event.pageX) + 'px';
            span.style.top = (event.pageY) + 'px';
        } else if (targetButton) {
            // ボタンタップ時：ボタンの中心からミストを出す（これまで通り）
            const rect = targetButton.getBoundingClientRect();
            span.style.left = (rect.left + window.scrollX + rect.width / 2) + 'px';
            span.style.top = (rect.top + window.scrollY + rect.height / 2) + 'px';
        }
        
        document.body.appendChild(span);
        setTimeout(() => { span.remove(); }, 1200);
    }

    // 指定された月の日付を自動生成して並べる関数
    function renderCalendar() {
        const daysContainer = document.getElementById('calendar-days');
        daysContainer.innerHTML = '';

        // 基準にする日時を calendarDate から取得
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth(); // 0が1月、11が12月

    
        // カレンダーの上のラベルを数字だけの表示に書き換える（0が1月なので +1 する）
        document.getElementById('calendar-month').textContent = month + 1;

        // 1日の曜日（0:日〜6:土）と、今月の最終日を取得
        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        // 1日より前の空白のマスを埋める
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'calendar-day empty';
            daysContainer.appendChild(emptyDiv);
        }
       // 今日の日付を判定するための基準を取得
        const today = new Date();
        const isCurrentYear = year === today.getFullYear();
        const isCurrentMonth = month === today.getMonth();

        // 1日から最終日までの数字を並べる
        for (let date = 1; date <= lastDate; date++) {
            const dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';
            dayDiv.textContent = date;

        // 🌟【修正】最新の生理開始日（periodStarts）をもとに、未来の周期（28日後〜32日後）を正しく予測する
            if (periodStarts.length > 0) {
                // 一番直近（最後）の生理開始日を取得
                const lastStartStr = periodStarts[periodStarts.length - 1];
                const lastStartDate = new Date(lastStartStr);
                
                // 現在ループしているマスの日付オブジェクトを作る
                const currentGridDate = new Date(year, month, date);
                
                // 直近の生理開始日から、このマスまでの経過日数を計算
                const diffTime = currentGridDate - lastStartDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                // 経過日数が「28日〜32日」の間、または周期が長引いた場合の「56日〜60日後（2周期先）」などもカバー
                const isNextPeriodPrediction = (diffDays >= 28 && diffDays <= 32) || (diffDays >= 56 && diffDays <= 60);
                
                if (isNextPeriodPrediction) {
                    dayDiv.style.backgroundColor = '#fff0f0'; // ごくごく淡いペールピンクの灯り
                    dayDiv.style.borderRadius = '4px';
                }
            }

            // 🌟【追加】日付をタップしたときにその日を選択するイベントを紐付け
            dayDiv.onclick = () => selectDay(year, month, date);

        // 実行している年・月・日が「今日」と一致したらクラスを付与
        if (isCurrentYear && isCurrentMonth && date === today.getDate()) {
                dayDiv.classList.add('is-today');
            }

            const currentLoopDateStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(date).padStart(2, '0')}`;
            if (selectedDateStr === currentLoopDateStr) {
                dayDiv.classList.add('is-selected');
            }

            // 👑 2026年の10月7日だけに王冠クラスを灯す
            if (currentLoopDateStr === "2026/10/07") {
                dayDiv.classList.add('is-special-crown');
            }

            // 🌟 カレンダーのドットはお金とメモだけに絞ってノイズカット
            const hasRecord = historyLogs.some(log => log.type === 'minus' && log.date.startsWith(currentLoopDateStr));
        
            if (hasRecord) {
                dayDiv.classList.add('has-dot'); 
            }

            if (dailyMemos[currentLoopDateStr]) {
                dayDiv.classList.add('has-memo-dot'); 
            }

        // 開始日から終了日までの「すべての期間中」に📍クラスを付与する
        let isInPeriod = false;
        
        // 登録されているすべての「開始日」をループしてチェック
        periodStarts.forEach(startStr => {
            const startDate = new Date(startStr);
            const currentGridDate = new Date(currentLoopDateStr); // 🌟ここも currentLoopDateStr に統一
            
            // この開始日以降の、一番近い「終了日」を探す
            const nextEndStr = periodEnds.find(endStr => endStr >= startStr);
            
            if (nextEndStr) {
                // 終了日が見つかっている場合、その期間内かどうか
                const endDate = new Date(nextEndStr);
                if (currentGridDate >= startDate && currentGridDate <= endDate) {
                    isInPeriod = true;
                }
            } else {
                // まだ終了日が未登録（生理中）の場合、開始日当日だけ📍を灯しておく
                if (currentLoopDateStr === startStr) { // 🌟ここも currentLoopDateStr に統一
                    isInPeriod = true;
                }
            }
        });

        if (isInPeriod) {
            dayDiv.classList.add('is-period-start'); // 📍マークを灯す
        }

            daysContainer.appendChild(dayDiv);
        }
    }
    // 月を切り替える関数（-1 で前月、1 で来月）
    function changeMonth(offset) {
        // 現在の表示月から offset 分だけ月をズラす
        calendarDate.setMonth(calendarDate.getMonth() + offset);
        renderCalendar(); // 新しい年月でカレンダーを再描画
    }

        // 日付をタップしたときの処理
    function selectDay(year, month, date) {
        const targetStr = `${year}/${String(month + 1).padStart(2, '0')}/${String(date).padStart(2, '0')}`;
        
        const memoSection = document.getElementById('daily-memo-section');
        const memoInput = document.getElementById('daily-memo-input');
        const memoLabel = document.getElementById('selected-day-label');

        // すでに選択されている日をもう一度タップしたら、選択を解除（全件表示に戻す）
        if (selectedDateStr === targetStr) {
            selectedDateStr = null;
            memoSection.style.display = 'none'; // メモエリアをひっそり閉じる
            memoInput.value = '';
        } else {
            selectedDateStr = targetStr;
            
            // メモエリアを表示し、ラベルを「◯月◯日のきろく」に書き換える
            memoLabel.textContent = `${month + 1}/${String(date).padStart(2, '0')} のきろく`;
            memoSection.style.display = 'block';
            
            // 🌟 保存されているメモがあれば入力欄に呼び出し、なければ空にする
            memoInput.value = dailyMemos[targetStr] || '';

           // 🌟【修正】その日が「開始日」か「終了日」かそれぞれチェックして復元する
            const startCheckbox = document.getElementById('period-start-checkbox');
            const endCheckbox = document.getElementById('period-end-checkbox');
            
            startCheckbox.checked = periodStarts.includes(targetStr);
            endCheckbox.checked = periodEnds.includes(targetStr);
        }
        
 // ☀️ 保存されている天気があれば選択状態を復元する
            const savedWeather = dailyWeathers[targetStr];
            document.querySelectorAll('#weather-select-group span').forEach(el => el.classList.remove('is-weather-selected'));
            if (savedWeather) {
                const activeWeatherEl = document.getElementById(`we-${savedWeather}`);
                if (activeWeatherEl) activeWeatherEl.classList.add('is-weather-selected');
            }

        // カレンダーと履歴を最新の選択状態で再描画
        renderCalendar();
        renderHistory();
    }

    // 🌟【追加】入力された体調・お薬メモを自動でローカルストレージに保存する関数
    function saveDailyMemo() {
        if (!selectedDateStr) return;
        
        const memoInput = document.getElementById('daily-memo-input');
        const text = memoInput.value.trim();
        
        if (text === '') {
            // 中身が空っぽになったら、データサイズを増やさないよう綺麗に削除する
            delete dailyMemos[selectedDateStr];
        } else {
            // その日付のキーにメモテキストを保存
            dailyMemos[selectedDateStr] = text;
        }
        
        // ローカルストレージに記憶させる
        localStorage.setItem('myDailyMemos', JSON.stringify(dailyMemos));
        renderCalendar();
    }

    // 🌟【追加】開始チェックボックスが動いたとき
    function savePeriodStart() {
        if (!selectedDateStr) return;
        const checkbox = document.getElementById('period-start-checkbox');
        
        if (checkbox.checked) {
            if (!periodStarts.includes(selectedDateStr)) periodStarts.push(selectedDateStr);
        } else {
            periodStarts = periodStarts.filter(date => date !== selectedDateStr);
        }
        periodStarts.sort();
        localStorage.setItem('myPeriodStarts', JSON.stringify(periodStarts));
        renderCalendar();
    }

    // 🌟【追加】終了チェックボックスが動いたとき
    function savePeriodEnd() {
        if (!selectedDateStr) return;
        const checkbox = document.getElementById('period-end-checkbox');
        
        if (checkbox.checked) {
            if (!periodEnds.includes(selectedDateStr)) periodEnds.push(selectedDateStr);
        } else {
            periodEnds = periodEnds.filter(date => date !== selectedDateStr);
        }
        periodEnds.sort();
        localStorage.setItem('myPeriodEnds', JSON.stringify(periodEnds));
        renderCalendar();
    }

    // ☀️ タップされた天気を記憶・消去するスマート関数
    function selectWeather(weatherEmoji) {
        if (!selectedDateStr) return;

        const currentSaved = dailyWeathers[selectedDateStr];
        
        // すでに同じ天気が選ばれていたら消去（トグル挙動）
        if (currentSaved === weatherEmoji) {
            delete dailyWeathers[selectedDateStr];
        } else {
            dailyWeathers[selectedDateStr] = weatherEmoji;
        }

        // ローカルストレージに記憶
        localStorage.setItem('myDailyWeathers', JSON.stringify(dailyWeathers));

        // 選択状態の見た目をリアルタイム更新
        document.querySelectorAll('#weather-select-group span').forEach(el => el.classList.remove('is-weather-selected'));
        const newSaved = dailyWeathers[selectedDateStr];
        if (newSaved) {
            document.getElementById(`we-${newSaved}`).classList.add('is-weather-selected');
        }
        
        renderCalendar(); // カレンダー側にも変化を出したい時のために再描画
    }

    // 💊 アプリ起動時にお薬の記録をひっそりチェックする関数
function checkPillsReminder() {
    const todayObj = new Date();
    const todayStr = `${todayObj.getFullYear()}/${String(todayObj.getMonth() + 1).padStart(2, '0')}/${String(todayObj.getDate()).padStart(2, '0')}`;
    
    // 今日のメモを取得（なければ空文字）
    const todayMemo = dailyMemos[todayStr] || "";
    
    // もし今日のメモに「💊」が含まれていたら、優しく灯す
    if (todayMemo.includes("💊")) {
        // 通知用の要素をその場で作る
        const toast = document.createElement('div');
        toast.className = 'pills-reminder-toast';
        toast.textContent = 'Take it easy:) 💊'; // メッセージも優しく調律
        
        document.body.appendChild(toast);
        
        // アニメーションが終わる4秒後に自動で要素を消去
        setTimeout(() => { toast.remove(); }, 4000);
    }

}

// ページが読み込まれたら自動で実行する（既存のコードの起動処理にブレンド）
window.addEventListener('DOMContentLoaded', () => {

    setTimeout(checkPillsReminder, 600);
});

// 🔒【修正】すべてのデータを1つのテキストファイル（.txt）として出力する
function exportData() {
    const allData = {
        balance: localStorage.getItem('myBalance'),
        historyLogs: localStorage.getItem('myHistoryLogs'),
        dailyMemos: localStorage.getItem('myDailyMemos'),
        dailyWeathers: localStorage.getItem('myDailyWeathers'),
        periodStarts: localStorage.getItem('myPeriodStarts'),
        periodEnds: localStorage.getItem('myPeriodEnds'),
        budgetValue: localStorage.getItem('myBudgetValue')
    };
    
    // text/plain に変更してテキストファイルとして出力
    const dataStr = "data:text/plain;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
    const downloadAnchor = document.createElement('a');
    
    const now = new Date();
    const dateSlot = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
    
    downloadAnchor.setAttribute("href", dataStr);
    // ファイル名を lucca_backup_日付.txt に変更
    downloadAnchor.setAttribute("download", `lucca_backup_${dateSlot}.txt`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// 🔒【修正】拡張子 .txt ファイルを読み込んでデータを完全に復元する
function importData() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    // .txt ファイルのみ受け付けるように変更
    fileInput.accept = '.txt';
    
    fileInput.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = event => {
            try {
                const imported = JSON.parse(event.target.result);
                
                if (imported.balance) localStorage.setItem('myBalance', imported.balance);
                if (imported.historyLogs) localStorage.setItem('myHistoryLogs', imported.historyLogs);
                if (imported.dailyMemos) localStorage.setItem('myDailyMemos', imported.dailyMemos);
                if (imported.dailyWeathers) localStorage.setItem('myDailyWeathers', imported.dailyWeathers);
                if (imported.periodStarts) localStorage.setItem('myPeriodStarts', imported.periodStarts);
                if (imported.periodEnds) localStorage.setItem('myPeriodEnds', imported.periodEnds);
                if (imported.budgetValue) localStorage.setItem('myBudgetValue', imported.budgetValue);
                
                alert('データを復元しました。再読み込みします。');
                window.location.reload();
                
            } catch (err) {
                alert('ファイルの形式が正しくないようです。');
            }
        };
        reader.readAsText(file);
    };
    
    fileInput.click();
}





</script>
</body>
